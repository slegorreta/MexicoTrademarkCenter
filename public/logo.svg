<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <!-- Icon block: dark navy square -->
  <rect x="4" y="8" width="88" height="88" rx="14" fill="#0d1f3c"/>

  <!-- MX text inside square -->
  <text x="48" y="50" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#c9a84c" text-anchor="middle" letter-spacing="-1">MX</text>

  <!-- Document icon outline -->
  <rect x="26" y="58" width="34" height="30" rx="4" fill="none" stroke="#0d1f3c" stroke-width="2.2"/>
  <rect x="24" y="56" width="34" height="30" rx="4" fill="white" stroke="#0d1f3c" stroke-width="2"/>
  <!-- Document fold corner -->
  <polyline points="49,56 49,63 56,63" fill="none" stroke="#0d1f3c" stroke-width="1.8"/>
  <!-- R circle -->
  <circle cx="38" cy="72" r="7" fill="none" stroke="#0d1f3c" stroke-width="2"/>
  <text x="38" y="76" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#0d1f3c" text-anchor="middle">R</text>

  <!-- Circuit lines left of document -->
  <line x1="8" y1="72" x2="22" y2="72" stroke="#0d1f3c" stroke-width="1.8"/>
  <circle cx="8" cy="72" r="2.2" fill="#0d1f3c"/>
  <line x1="8" y1="65" x2="22" y2="65" stroke="#0d1f3c" stroke-width="1.8"/>
  <circle cx="8" cy="65" r="2.2" fill="#0d1f3c"/>
  <line x1="8" y1="79" x2="22" y2="79" stroke="#0d1f3c" stroke-width="1.8"/>
  <circle cx="8" cy="79" r="2.2" fill="#0d1f3c"/>

  <!-- Gold sparkle / 4-point star top-right of document -->
  <g transform="translate(58,54)">
    <path d="M0,-7 L1.5,-1.5 L7,0 L1.5,1.5 L0,7 L-1.5,1.5 L-7,0 L-1.5,-1.5 Z" fill="#c9a84c"/>
  </g>

  <!-- Wordmark area -->
  <!-- "Mexico Trademark" -->
  <text x="108" y="50" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#0d1f3c" letter-spacing="-0.5">Mexico Trademark</text>

  <!-- "CENTER" -->
  <text x="108" y="78" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#c9a84c" letter-spacing="3">CENTER</text>

  <!-- Horizontal rule after CENTER -->
  <line x1="285" y1="71" x2="476" y2="71" stroke="#c9a84c" stroke-width="2.5"/>

  <!-- Tagline -->
  <text x="108" y="100" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#555" letter-spacing="0.2">AI-powered trademark registration service</text>
</svg>
